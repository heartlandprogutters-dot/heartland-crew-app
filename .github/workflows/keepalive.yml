name: Keep Supabase awake

# Free Supabase projects pause after about a week without traffic.
# This calls the public jobs feed once a day. It does not write anything.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the public jobs feed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL%/}/rest/v1/rpc/public_jobs_feed"
          echo
          echo "Supabase answered."
